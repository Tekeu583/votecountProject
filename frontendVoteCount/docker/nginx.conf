# ═══════════════════════════════════════════════════════════════════
# Aperçu des liens partagés sur les réseaux sociaux
# ═══════════════════════════════════════════════════════════════════
# WhatsApp, Facebook & co. n'exécutent PAS JavaScript : ils lisent le HTML
# brut. Comme cette SPA renvoie le même index.html pour toutes les routes,
# tous les liens partagés afficheraient la même vignette.
#
# On reconnaît donc ces robots à leur User-Agent et on relaie UNIQUEMENT
# leurs requêtes vers l'API, qui génère des balises Open Graph propres au
# candidat (sa photo, son nom). Les visiteurs humains reçoivent la SPA
# inchangée.
map $http_user_agent $is_social_crawler {
    default                    0;
    "~*facebookexternalhit"    1;
    "~*facebookcatalog"        1;
    "~*WhatsApp"               1;
    "~*Twitterbot"             1;
    "~*TelegramBot"            1;
    "~*LinkedInBot"            1;
    "~*Slackbot"               1;
    "~*Discordbot"             1;
    "~*Pinterest"              1;
    "~*redditbot"              1;
    "~*Googlebot"              1;
    "~*bingbot"                1;
    "~*Applebot"               1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Résolveur DNS interne de Docker : indispensable pour que le nom du
    # service « backend » soit résolu à chaque requête plutôt qu'au
    # démarrage — sinon nginx refuse de démarrer si l'API n'est pas encore
    # prête.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # -- Gzip ----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # -- Fiche candidat : aperçu enrichi pour les robots sociaux -------
    # Même URL pour tous ; seul le contenu servi diffère selon le visiteur.
    #
    # On bascule par réécriture interne plutôt qu'avec un `proxy_pass` placé
    # dans le `if` : cette dernière forme entre en conflit avec `try_files` et
    # fait répondre 404 à nginx alors même que l'API a correctement répondu.
    location ~ "^/details/candidat/election/[0-9a-fA-F-]{36}/candidate/[0-9a-fA-F-]{36}/?$" {
        if ($is_social_crawler) {
            rewrite ^ /__og$request_uri? last;
        }

        try_files $uri /index.html;
    }

    # Cible interne de la réécriture : inatteignable directement de l'extérieur.
    location ~ "^/__og/details/candidat/election/([0-9a-fA-F-]{36})/candidate/([0-9a-fA-F-]{36})" {
        internal;

        proxy_pass http://backend:8000/api/v1/share/elections/$1/candidates/$2;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un robot qui attend trop abandonne et n'affiche aucun aperçu.
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
    }

    # -- SPA routing : toute URL non-fichier renvoie index.html --------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -- Cache long pour les assets versionnés par Vite ----------------
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -- Pas de cache sur index.html ----------------------------------─
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # -- Sécurité minimale --------------------------------------------─
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -- Erreurs ------------------------------------------------------─
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}