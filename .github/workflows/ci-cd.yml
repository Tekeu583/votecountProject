name: CI/CD Pipeline

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:

  # ═══════════════════════════════════════════════════════════════
  # JOB 1 : TESTS BACKEND
  # ═══════════════════════════════════════════════════════════════
  tests:
    name: Tests Backend (Laravel + PostgreSQL + Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: votecountproject3_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: tarsenek
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo, pdo_pgsql, pgsql, redis, mbstring, zip, gd, bcmath, exif, pcntl
          coverage: none

      - name: Configuration de l'environnement de test
        working-directory: VoteCountProject3
        run: |
          cp .env.testing .env
          echo "APP_ENV=testing" >> .env
          echo "DB_CONNECTION=pgsql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=5432" >> .env
          echo "DB_DATABASE=votecountproject3_test" >> .env
          echo "DB_USERNAME=postgres" >> .env
          echo "DB_PASSWORD=tarsenek" >> .env
          echo "REDIS_HOST=127.0.0.1" >> .env
          echo "REDIS_PORT=6379" >> .env
          echo "REDIS_CLIENT=phpredis" >> .env
          echo "CACHE_STORE=redis" >> .env
          echo "SESSION_DRIVER=array" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "MAIL_MAILER=array" >> .env

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: VoteCountProject3/vendor
          key: composer-${{ hashFiles('VoteCountProject3/composer.lock') }}
          restore-keys: composer-

      - name: Installation des dépendances
        working-directory: VoteCountProject3
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Génération de la clé d'application
        working-directory: VoteCountProject3
        run: php artisan key:generate --force

      - name: Exécution des migrations
        working-directory: VoteCountProject3
        run: php artisan migrate --force

      - name: Exécution des tests
        working-directory: VoteCountProject3
        run: php artisan test

  # ═══════════════════════════════════════════════════════════════
  # JOB 2 : DÉPLOIEMENT (uniquement sur main, uniquement si tests OK)
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: Déploiement sur VPS Contabo
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de la clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Ajout du VPS aux hôtes connus
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2222 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Déploiement sur le VPS
        run: |
          ssh -p 2222 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            echo "→ Déploiement démarré à $(date)"

            cd ~/apps/votecount

            echo "→ Reprise temporaire des permissions pour git..."
            sudo chown -R arsene:arsene VoteCountProject3/storage VoteCountProject3/bootstrap/cache 2>/dev/null || true

            echo "→ Récupération de la dernière version..."
            git fetch origin main
            git reset --hard origin/main

            echo "→ Restauration des permissions www-data..."
            sudo chown -R 33:33 VoteCountProject3/storage VoteCountProject3/bootstrap/cache
            sudo chmod -R 775 VoteCountProject3/storage VoteCountProject3/bootstrap/cache

            echo "→ Rebuild des images Docker..."
            docker compose up -d --build

            echo "→ Attente que le backend soit prêt (30s)..."
            sleep 30

            echo "→ Exécution des migrations..."
            docker compose exec -T backend php artisan migrate --force

            echo "→ Rafraîchissement des caches..."
            docker compose exec -T backend php artisan optimize:clear
            docker compose exec -T backend php artisan config:cache

            echo "→ Vérification de l'état des containers..."
            docker compose ps

            echo "✓ Déploiement terminé à $(date)"
          EOF

      - name: Vérification post-déploiement
        run: |
          sleep 10
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api.votecount.space/api/v1/elections/public)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ API répond correctement (HTTP 200)"
          else
            echo "✗ API renvoie HTTP $HTTP_CODE — problème de déploiement"
            exit 1
          fi