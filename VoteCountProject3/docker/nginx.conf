# ═══════════════════════════════════════════════════════════════
# Nginx dans le conteneur backend
# Écoute sur :8000 → transmet vers php-fpm 127.0.0.1:9000
# Sert les fichiers statiques (public/) directement pour la perf
# ═══════════════════════════════════════════════════════════════

server {
    listen 8000 default_server;
    listen [::]:8000 default_server;

    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Volumétrie des imports d'électeurs / documents de candidature
    client_max_body_size 25m;

    # Compression gzip pour réponses JSON de l'API
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        text/javascript;

    # Sécurité de base
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    charset utf-8;
    access_log off;
    error_log /var/log/nginx/error.log warn;

    # Bloquer les fichiers cachés (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Route principale — front controller Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Fichiers statiques : les servir directement, cache long
    location ~* \.(?:jpg|jpeg|gif|png|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        # ATTENTION nginx : dès qu'un bloc déclare son propre add_header, il
        # n'hérite PLUS de ceux du serveur. Les en-têtes de sécurité doivent
        # donc être répétés ici, sinon ils disparaissent sur tous les statiques.
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Transmission au PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param DOCUMENT_ROOT $document_root;

        # Timeouts adaptés aux imports d'électeurs volumineux
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
        fastcgi_connect_timeout 60s;

        # Buffers
        fastcgi_buffering on;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}