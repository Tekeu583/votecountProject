# Configuration nginx utilisée UNIQUEMENT par docker-compose.loadtest.yml,
# pour mesurer ce que donnerait l'API servie par php-fpm au lieu du serveur
# HTTP intégré de PHP (`artisan serve`), qui ne traite qu'une requête à la fois.
#
# API pure : aucun fichier statique n'est servi ici, toutes les requêtes sont
# transmises au front controller Laravel — nginx n'a donc pas besoin d'accéder
# au code, seul php-fpm le voit.

upstream php_backend {
    server backend-fpm:9000;
}

server {
    listen 80 default_server;
    server_name _;

    # Volumétrie des imports d'électeurs / documents de candidature.
    client_max_body_size 25m;

    access_log off;

    location / {
        include fastcgi_params;

        fastcgi_pass php_backend;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;

        fastcgi_read_timeout 120s;
        fastcgi_buffering on;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
