[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
loglevel=info

; --------------------------------------------------------------═
; Laravel HTTP (écoute sur 8000)
; --------------------------------------------------------------═
[program:laravel-server]
command=php /var/www/html/artisan serve --host=0.0.0.0 --port=8000
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --------------------------------------------------------------═
; Queue worker
; Traite : SendOtpCode, CalculateElectionResults, ProcessElectorImport,
; SendVoterCodeNotification, etc.
; Priorise "high" (OTP) sur "default"
; --------------------------------------------------------------═
[program:queue-worker]
command=php /var/www/html/artisan queue:work redis --queue=high,default --sleep=3 --tries=3 --max-time=3600 --backoff=10
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
numprocs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=3600

; --------------------------------------------------------------═
; Scheduler
; Déclenche : ProcessElectionLifecycle, ProcessSubscriptionRenewals,
; PurgeExpiredTrash, LinkCandidateAccounts
; --------------------------------------------------------------═
[program:scheduler]
command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --------------------------------------------------------------═
; Reverb WebSocket (broadcast temps réel : LiveResultsUpdated, VoteCast)
; --------------------------------------------------------------═
[program:reverb]
command=php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0