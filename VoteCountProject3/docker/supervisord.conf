[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
loglevel=info

; ═══════════════════════════════════════════════════════════════
; NGINX — reverse proxy vers PHP-FPM sur le port 8000
; ═══════════════════════════════════════════════════════════════
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ═══════════════════════════════════════════════════════════════
; PHP-FPM — multi-processus (pool "www" configuré dans Dockerfile)
; Remplace `php artisan serve` qui était mono-process (LATENCE +++).
; ═══════════════════════════════════════════════════════════════
[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ═══════════════════════════════════════════════════════════════
; Queue worker (Redis) — inchangé
; Traite : SendOtpCode, CalculateElectionResults, ProcessElectorImport, etc.
; ═══════════════════════════════════════════════════════════════
[program:queue-worker]
command=php /var/www/html/artisan queue:work redis --queue=high,default --sleep=3 --tries=3 --max-time=3600 --backoff=10
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
numprocs=1
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopwaitsecs=3600

; ═══════════════════════════════════════════════════════════════
; Scheduler — inchangé
; ═══════════════════════════════════════════════════════════════
[program:scheduler]
command=/bin/sh -c "while true; do php /var/www/html/artisan schedule:run --verbose --no-interaction; sleep 60; done"
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ═══════════════════════════════════════════════════════════════
; Reverb WebSocket sur port 8080 — inchangé
; ═══════════════════════════════════════════════════════════════
[program:reverb]
command=php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
directory=/var/www/html
autostart=true
autorestart=true
user=www-data
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0