services:

  # --------------------------------------------------------------═
  # POSTGRESQL 16
  # --------------------------------------------------------------═
  postgres:
    image: postgres:16-alpine
    container_name: votecount_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Africa/Douala
      PGTZ: Africa/Douala
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - votecount

  # --------------------------------------------------------------═
  # REDIS 7 (cache + sessions + queue + broadcast)
  # --------------------------------------------------------------═
  redis:
    image: redis:7-alpine
    container_name: votecount_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - votecount

  # --------------------------------------------------------------═
  # BACKEND LARAVEL (php + queue + scheduler + reverb via supervisord)
  # --------------------------------------------------------------═
  backend:
    build:
      context: ./VoteCountProject3
      dockerfile: Dockerfile
    container_name: votecount_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./VoteCountProject3/.env
    volumes:
      - ./VoteCountProject3/storage:/var/www/html/storage
      - ./VoteCountProject3/bootstrap/cache:/var/www/html/bootstrap/cache
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8080:8080"
    networks:
      - votecount

  # --------------------------------------------------------------═
  # FRONTEND REACT (Vite build servi par nginx)
  # --------------------------------------------------------------═
  frontend:
    build:
      context: ./frontendVoteCount
      dockerfile: Dockerfile
    container_name: votecount_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - votecount

networks:
  votecount:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local